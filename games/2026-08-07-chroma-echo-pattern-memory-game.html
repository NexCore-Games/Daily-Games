<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CHROMA ECHO - Pattern Memory Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background: #080814;
      background-image: radial-gradient(circle at 50% 30%, #1a1a3a 0%, #080814 80%);
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      overflow: hidden;
    }
    header {
      text-align: center;
      margin-top: 4px;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #00f3ff, #ff0055);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
      text-transform: uppercase;
    }
    .instructions {
      font-size: 0.8rem;
      color: #a0a0c0;
      margin-top: 2px;
    }
    .stats-bar {
      display: flex;
      gap: 16px;
      margin: 10px 0;
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
    }
    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .stat-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      color: #8888aa;
      letter-spacing: 1px;
    }
    .stat-value {
      font-size: 1.1rem;
      font-weight: bold;
      color: #00f3ff;
    }
    .lives-container {
      display: flex;
      gap: 4px;
      margin-top: 2px;
    }
    .life-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff0055;
      box-shadow: 0 0 8px #ff0055;
      transition: all 0.3s ease;
    }
    .life-dot.lost {
      background: #333;
      box-shadow: none;
    }
    .timer-bar-bg {
      width: 100%;
      max-width: 360px;
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      margin-bottom: 8px;
      overflow: hidden;
    }
    .timer-bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #00f3ff, #ff0055);
      border-radius: 3px;
      transition: width 0.1s linear;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 380px;
      aspect-ratio: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      width: 100%;
      height: 100%;
      border-radius: 16px;
      cursor: pointer;
    }
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(8, 8, 20, 0.88);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 10;
      transition: opacity 0.3s ease;
    }
    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .overlay h2 {
      font-size: 2rem;
      margin-bottom: 8px;
      color: #fff;
    }
    .overlay p {
      font-size: 0.9rem;
      color: #aaa;
      margin-bottom: 20px;
      max-width: 260px;
      line-height: 1.4;
    }
    .btn {
      background: linear-gradient(135deg, #00f3ff, #0077ff);
      color: #000;
      font-weight: 800;
      font-size: 1rem;
      padding: 12px 32px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
      transition: transform 0.1s ease, box-shadow 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.7);
    }
    .btn:active {
      transform: scale(0.98);
    }
    footer {
      margin-bottom: 4px;
      font-size: 0.75rem;
      color: #555577;
    }
    footer span {
      color: #00f3ff;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <h1>Chroma Echo</h1>
    <div class="instructions">Watch the neon sequence and repeat it accurately!</div>
  </header>

  <div class="stats-bar">
    <div class="stat">
      <span class="stat-label">Score</span>
      <span class="stat-value" id="score">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">High Score</span>
      <span class="stat-value" id="high-score">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">Round</span>
      <span class="stat-value" id="round">1</span>
    </div>
    <div class="stat">
      <span class="stat-label">Lives</span>
      <div class="lives-container" id="lives">
        <div class="life-dot"></div>
        <div class="life-dot"></div>
        <div class="life-dot"></div>
      </div>
    </div>
  </div>

  <div class="timer-bar-bg">
    <div class="timer-bar-fill" id="timer-bar"></div>
  </div>

  <div id="game-container">
    <canvas id="canvas" width="400" height="400"></canvas>
    
    <div id="start-overlay" class="overlay">
      <h2>READY?</h2>
      <p>Memorize the audio-visual sequence. Use Touch, Mouse, or Keys (1-9).</p>
      <button class="btn" id="start-btn">PLAY</button>
    </div>

    <div id="gameover-overlay" class="overlay hidden">
      <h2 style="color: #ff0055;">GAME OVER</h2>
      <p id="final-stats">You reached Round 1!</p>
      <button class="btn" id="restart-btn">RETRY</button>
    </div>
  </div>

  <footer>Crafted by <span>NexCore Games</span></footer>

<script>
(() => {
  // --- Web Audio Synthesizer ---
  class SoundFX {
    constructor() {
      this.ctx = null;
      // Frequencies for 9 pads (C4 major pentatonic/extended scale)
      this.freqs = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25, 587.33];
    }
    init() {
      if (!this.ctx) {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }
    playTone(index, duration = 0.3) {
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(this.freqs[index] || 440, this.ctx.currentTime);

      gain.gain.setValueAtTime(0.01, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.3, this.ctx.currentTime + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

      osc.connect(gain);
      gain.connect(this.ctx.destination);

      osc.start();
      osc.stop(this.ctx.currentTime + duration);
    }
    playError() {
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(130, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(60, this.ctx.currentTime + 0.4);

      gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);

      osc.connect(gain);
      gain.connect(this.ctx.destination);

      osc.start();
      osc.stop(this.ctx.currentTime + 0.4);
    }
    playSuccess() {
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      [523.25, 659.25, 783.99].forEach((f, i) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.frequency.setValueAtTime(f, now + i * 0.08);
        gain.gain.setValueAtTime(0.15, now + i * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now + i * 0.08);
        osc.stop(now + i * 0.08 + 0.2);
      });
    }
  }

  // --- Game Config & Colors ---
  const padColors = [
    { main: '#ff0055', glow: 'rgba(255, 0, 85, 0.8)' },    // Red-Pink
    { main: '#00f3ff', glow: 'rgba(0, 243, 255, 0.8)' },   // Cyan
    { main: '#00ff66', glow: 'rgba(0, 255, 102, 0.8)' },   // Neon Green
    { main: '#ffe600', glow: 'rgba(255, 230, 0, 0.8)' },   // Yellow
    { main: '#b000ff', glow: 'rgba(176, 0, 255, 0.8)' },   // Purple
    { main: '#ff7700', glow: 'rgba(255, 119, 0, 0.8)' },   // Orange
    { main: '#ff00aa', glow: 'rgba(255, 0, 170, 0.8)' },   // Magenta
    { main: '#00aeff', glow: 'rgba(0, 174, 255, 0.8)' },   // Blue
    { main: '#ffffff', glow: 'rgba(255, 255, 255, 0.8)' }   // White
  ];

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const sound = new SoundFX();

  // Elements
  const elScore = document.getElementById('score');
  const elHighScore = document.getElementById('high-score');
  const elRound = document.getElementById('round');
  const elLives = document.getElementById('lives').children;
  const elTimerBar = document.getElementById('timer-bar');
  const startOverlay = document.getElementById('start-overlay');
  const gameoverOverlay = document.getElementById('gameover-overlay');
  const finalStats = document.getElementById('final-stats');

  // Game State Variables
  let score = 0;
  let highScore = parseInt(localStorage.getItem('chroma_echo_hi') || '0', 10);
  let round = 1;
  let lives = 3;
  let sequence = [];
  let playerStep = 0;
  let state = 'IDLE'; // IDLE, PLAYING, INPUT, GAMEOVER
  let activePad = null;
  let activeTimer = null;
  let particles = [];
  let timeRemaining = 100;
  let timerInterval = null;

  elHighScore.textContent = highScore;

  // --- Grid & Pad Coordinates ---
  const grid = [];
  const padMargin = 14;
  const padSize = (400 - padMargin * 4) / 3;

  for (let r = 0; r < 3; r++) {
    for (let c = 0; c < 3; c++) {
      grid.push({
        id: r * 3 + c,
        x: padMargin + c * (padSize + padMargin),
        y: padMargin + r * (padSize + padMargin),
        w: padSize,
        h: padSize,
        key: (r * 3 + c + 1).toString(),
        scale: 1.0,
        brightness: 0
      });
    }
  }

  // --- Render Loop ---
  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw background
    ctx.fillStyle = '#0e0e20';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw Pads
    grid.forEach((pad, i) => {
      ctx.save();
      const centerX = pad.x + pad.w / 2;
      const centerY = pad.y + pad.h / 2;
      
      ctx.translate(centerX, centerY);
      ctx.scale(pad.scale, pad.scale);

      const isLit = activePad === i;
      const color = padColors[i];

      // Base Pad Shape
      ctx.beginPath();
      ctx.roundRect(-pad.w / 2, -pad.h / 2, pad.w, pad.h, 16);
      
      if (isLit) {
        ctx.fillStyle = color.main;
        ctx.shadowColor = color.glow;
        ctx.shadowBlur = 25;
      } else {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      ctx.fill();

      // Inner pad detail / ring
      ctx.beginPath();
      ctx.roundRect(-pad.w / 2 + 8, -pad.h / 2 + 8, pad.w - 16, pad.h - 16, 12);
      ctx.fillStyle = isLit ? 'rgba(255, 255, 255, 0.4)' : color.main + '22';
      ctx.fill();

      // Keyhint label
      ctx.fillStyle = isLit ? '#000' : 'rgba(255, 255, 255, 0.4)';
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'bottom';
      ctx.fillText(pad.key, pad.w / 2 - 12, pad.h / 2 - 10);

      ctx.restore();
    });

    // Render Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.alpha -= 0.02;
      if (p.alpha <= 0) {
        particles.splice(i, 1);
        continue;
      }
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    requestAnimationFrame(render);
  }

  function createParticles(x, y, color) {
    for (let i = 0; i < 16; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 4;
      particles.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: 3 + Math.random() * 3,
        color: color,
        alpha: 1
      });
    }
  }

  // --- Game Logic ---
  function startGame() {
    sound.init();
    score = 0;
    round = 1;
    lives = 3;
    sequence = [];
    updateUI();
    startOverlay.classList.add('hidden');
    gameoverOverlay.classList.add('hidden');
    nextRound();
  }

  function nextRound() {
    state = 'PLAYING';
    playerStep = 0;
    sequence.push(Math.floor(Math.random() * 9));
    updateUI();
    stopTimer();

    // Delay before starting pattern display
    setTimeout(() => {
      playSequence();
    }, 600);
  }

  function playSequence() {
    let i = 0;
    // Speed increases as rounds progress
    const speed = Math.max(220, 500 - round * 20);

    const interval = setInterval(() => {
      if (state !== 'PLAYING') {
        clearInterval(interval);
        return;
      }

      const padIndex = sequence[i];
      flashPad(padIndex, speed * 0.7);

      i++;
      if (i >= sequence.length) {
        clearInterval(interval);
        setTimeout(() => {
          if (state === 'PLAYING') {
            state = 'INPUT';
            startTimer();
          }
        }, speed);
      }
    }, speed);
  }

  function flashPad(index, duration = 250) {
    activePad = index;
    const pad = grid[index];
    pad.scale = 0.94;
    sound.playTone(index, duration / 1000);

    createParticles(pad.x + pad.w / 2, pad.y + pad.h / 2, padColors[index].main);

    setTimeout(() => {
      if (activePad === index) activePad = null;
      pad.scale = 1.0;
    }, duration);
  }

  function handlePadInput(index) {
    if (state !== 'INPUT') return;

    flashPad(index, 200);

    if (sequence[playerStep] === index) {
      // Correct input
      playerStep++;
      score += 10 * round;
      updateUI();

      if (playerStep >= sequence.length) {
        // Round Complete
        state = 'PLAYING';
        stopTimer();
        sound.playSuccess();
        round++;
        setTimeout(nextRound, 800);
      } else {
        // Reset turn timer on valid step
        resetTimer();
      }
    } else {
      // Wrong Input
      handleMistake();
    }
  }

  function handleMistake() {
    state = 'PLAYING';
    stopTimer();
    sound.playError();
    lives--;
    updateUI();

    // Flash screen RED effect or visual feedback
    canvas.style.transform = 'translate(5px, 0)';
    setTimeout(() => canvas.style.transform = 'translate(-5px, 0)', 50);
    setTimeout(() => canvas.style.transform = 'translate(0, 0)', 100);

    if (lives <= 0) {
      gameOver();
    } else {
      // Re-play current sequence after a short delay
      setTimeout(() => {
        playerStep = 0;
        playSequence();
      }, 1000);
    }
  }

  function startTimer() {
    timeRemaining = 100;
    elTimerBar.style.width = '100%';
    const duration = Math.max(3000, 7000 - round * 200); // Time to finish player input
    const step = 50;

    timerInterval = setInterval(() => {
      timeRemaining -= (step / duration) * 100;
      elTimerBar.style.width = Math.max(0, timeRemaining) + '%';

      if (timeRemaining <= 0) {
        stopTimer();
        handleMistake();
      }
    }, step);
  }

  function resetTimer() {
    stopTimer();
    startTimer();
  }

  function stopTimer() {
    if (timerInterval) clearInterval(timerInterval);
    elTimerBar.style.width = '100%';
  }

  function gameOver() {
    state = 'GAMEOVER';
    stopTimer();

    if (score > highScore) {
      highScore = score;
      localStorage.setItem('chroma_echo_hi', highScore.toString());
      elHighScore.textContent = highScore;
    }

    finalStats.innerHTML = `Final Score: <strong style="color:#00f3ff;">${score}</strong><br>Round Reached: <strong>${round}</strong>`;
    gameoverOverlay.classList.remove('hidden');
  }

  function updateUI() {
    elScore.textContent = score;
    elRound.textContent = round;
    
    // Lives indicators
    for (let i = 0; i < elLives.length; i++) {
      if (i < lives) {
        elLives[i].classList.remove('lost');
      } else {
        elLives[i].classList.add('lost');
      }
    }
  }

  // --- Input Handlers ---
  function getPadFromCoords(x, y) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    
    const canvasX = (x - rect.left) * scaleX;
    const canvasY = (y - rect.top) * scaleY;

    for (let pad of grid) {
      if (
        canvasX >= pad.x &&
        canvasX <= pad.x + pad.w &&
        canvasY >= pad.y &&
        canvasY <= pad.y + pad.h
      ) {
        return pad.id;
      }
    }
    return null;
  }

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    sound.init();
    const padId = getPadFromCoords(e.clientX, e.clientY);
    if (padId !== null) {
      handlePadInput(padId);
    }
  });

  window.addEventListener('keydown', (e) => {
    sound.init();
    if (e.key >= '1' && e.
